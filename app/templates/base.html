<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Townsend Library</title>
    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='main.css') }}" />
    <script src="https://kit.fontawesome.com/8afa6f86d1.js" crossorigin="anonymous"></script>
</head>

<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark ">
        <div class="container-fluid">
            <a class="navbar-brand" href="{{ url_for('site.home') }}">
                <i class="fa-solid fa-book fa-custom"></i> Townsend Library
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse " id="navbarNav">
                <ul class="navbar-nav ms-auto rounded mx-5 pe-3">
                    <li class="nav-item">
                        <a class="nav-link" href="{{ url_for('site.home') }}">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{{ url_for('site.books') }}">Books</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{{ url_for('site.profile') }}">Profile</a>
                    </li>
                    {% if current_user.is_authenticated %}
                    <li class="nav-item">
                        <a class="nav-link" href="{{ url_for('auth.logout') }}">Sign Out</a>
                    </li>
                    {% else %}
                    <li class="nav-item ps-5">
                        <a class="nav-link bs-light" href="{{ url_for('auth.signin') }}">Sign In</a>
                    </li>
                    {% endif %}
                    <li class="nav-item">
                        <form action="{{ url_for('site.search') }}" method="GET" class="d-flex">
                            <input type="text" name="query" class="form-control rounded" placeholder="Search books..."
                                style="width: 150px;" />
                            <button type="submit" class="btn btn-outline-light mx-5 rounded">
                                <i class="fa-solid fa-search mb-3"></i>
                            </button>
                        </form>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    {% block content %}
    {% endblock %}

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
