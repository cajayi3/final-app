{% extends 'base.html' %}

{% block title %}Dashboard{% endblock %}

{% block content %}

<h2 class="dashboard">Dashboard</h2>
<br /><br />
<p>You are Logged In!</p>
<a href="{{ url_for('auth.logout')}}" class="logout">Logout</a>

<div class="books">
    <button type="button" class="add-book btn btn-success" data-toggle="modal" data-target="#mymodal">Add Book</button>
</div>

<table class="table">
    <thead>
        <tr class="titles">
            <th>Book Image</th>
            <th>Title</th>
            <th>Author</th>
            <th>Pages</th>
            <th>Cover Type</th>
            <th>ISBN</th>
            <th>Genre</th>
            <th>Actions</th>
        </tr>
    </thead>
    <tbody id="bookList"></tbody>
</table>

<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
<script>
    // Configure Axios to always send cookies with requests
    axios.defaults.withCredentials = true;

    let isEditMode = false;
    let editBookId = null;

    document.addEventListener("DOMContentLoaded", function () {
        fetchBooks();

        // Attach form submission listener after DOM is loaded
        const bookForm = document.getElementById("bookFormModal");
        if (bookForm) {
            bookForm.addEventListener("submit", function (event) {
                event.preventDefault();

                const bookData = {
                    title: document.getElementById("title").value,
                    author: document.getElementById("author").value,
                    pages: parseInt(document.getElementById("pages").value),
                    cover: document.getElementById("cover").value,
                    ISBN_number: document.getElementById("isbn").value,
                    genre: document.getElementById("genre").value,
                };

                if (isEditMode) {
                    axios.put(`/api/books/${editBookId}`, bookData)
                        .then(() => {
                            fetchBooks();
                            resetForm();
                            $('#mymodal').modal('hide');
                            alert('Book updated successfully!');
                        })
                        .catch(error => {
                            console.error("Error updating book:", error);
                            alert('Error updating book. Please try again.');
                        });
                } else {
                    axios.post("/api/books", bookData)
                        .then(() => {
                            fetchBooks();
                            resetForm();
                            $('#mymodal').modal('hide');
                            alert('Book added successfully!');
                        })
                        .catch(error => {
                            console.error("Error adding book:", error);
                            alert('Error adding book. Please try again.');
                        });
                }
            });
        } else {
            console.error("Book form not found!");
        }

        // Modal event listener
        $('#mymodal').on('hidden.bs.modal', function () {
            resetForm();
        });
    });

    function fetchBooks() {
        axios.get('/api/books')
            .then(response => {
                console.log("API Response:", response.data);

                const books = response.data;

                if (!Array.isArray(books)) {
                    console.error("Expected an array, but got:", books);
                    document.getElementById("bookList").innerHTML = '<tr><td colspan="8" class="text-center text-danger">Error loading books. Please sign in again.</td></tr>';
                    return;
                }

                const bookList = document.getElementById("bookList");
                bookList.innerHTML = "";

                if (books.length === 0) {
                    bookList.innerHTML = '<tr><td colspan="8" class="text-center">No books found. Add your first book!</td></tr>';
                    return;
                }

                books.forEach(book => {
                    bookList.innerHTML += `
                        <tr>
                            <td><img src="/static/images/${book.cover}" class="read" width="50" alt="${book.title}" onerror="this.src='/static/images/placeholder.png'"></td>
                            <td>${book.title}</td>
                            <td>${book.author}</td>
                            <td>${book.pages}</td>
                            <td>${book.cover}</td>
                            <td>${book.ISBN_number}</td>
                            <td>${book.genre}</td>
                            <td>
                                <button onclick="loadEditForm('${book.id}')" class="btn btn-warning btn-sm">Edit</button>
                                <button onclick="deleteBook('${book.id}')" class="btn btn-danger btn-sm">Delete</button>
                            </td>
                        </tr>
                    `;
                });
            })
            .catch(error => {
                console.error("Error fetching books:", error);
                document.getElementById("bookList").innerHTML = '<tr><td colspan="8" class="text-center text-danger">Error: Not authorized. Please sign in.</td></tr>';
            });
    }

    function loadEditForm(bookId) {
        axios.get(`/api/books/${bookId}`)
            .then(response => {
                const book = response.data;
                document.getElementById("title").value = book.title;
                document.getElementById("author").value = book.author;
                document.getElementById("pages").value = book.pages;
                document.getElementById("cover").value = book.cover;
                document.getElementById("isbn").value = book.ISBN_number;
                document.getElementById("genre").value = book.genre;

                isEditMode = true;
                editBookId = bookId;
                document.getElementById("modalTitle").textContent = "Edit Book";
                document.getElementById("submitBtn").textContent = "Update Book";

                $('#mymodal').modal('show');
            })
            .catch(error => {
                console.error("Error fetching book:", error);
                alert('Error loading book. Please try again.');
            });
    }

    function deleteBook(bookId) {
        if (confirm("Are you sure you want to delete this book?")) {
            axios.delete(`/api/books/${bookId}`)
                .then(() => {
                    console.log("Book deleted successfully");
                    fetchBooks();
                    alert('Book deleted successfully!');
                })
                .catch(error => {
                    console.error("Error deleting book:", error);
                    alert('Error deleting book. Please try again.');
                });
        }
    }

    function resetForm() {
        const bookForm = document.getElementById("bookFormModal");
        if (bookForm) {
            bookForm.reset();
        }
        isEditMode = false;
        editBookId = null;
        document.getElementById("modalTitle").textContent = "Add Book";
        document.getElementById("submitBtn").textContent = "Add Book";
    }
</script>

<div id="mymodal" class="modal fade" tabindex="-1" role="dialog">
    <div class="modal-dialog" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <h4 class="modal-title" id="modalTitle">Add Book</h4>
                <button type="button" class="close" data-dismiss="modal">&times;</button>
            </div>

            <div class="modal-body">
                <form id="bookFormModal">
                    <div class="form-group">
                        <label>Title:</label>
                        <input type="text" class="form-control" id="title" name="title" required>
                    </div>

                    <div class="form-group">
                        <label>Author:</label>
                        <input type="text" class="form-control" id="author" name="author" required>
                    </div>

                    <div class="form-group">
                        <label>Pages:</label>
                        <input type="number" class="form-control" id="pages" name="pages" required>
                    </div>

                    <div class="form-group">
                        <label>Cover:</label>
                        <input type="text" class="form-control" id="cover" name="cover" required>
                    </div>

                    <div class="form-group">
                        <label>ISBN:</label>
                        <input type="text" class="form-control" id="isbn" name="isbn" required>
                    </div>

                    <div class="form-group">
                        <label>Genre:</label>
                        <input type="text" class="form-control" id="genre" name="genre" required>
                    </div>

                    <div class="form-group">
                        <button class="btn btn-primary" type="submit" id="submitBtn">Add Book</button>
                    </div>
                </form>
            </div>

            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-dismiss="modal">Close</button>
            </div>
        </div>
    </div>
</div>
{% endblock %}
